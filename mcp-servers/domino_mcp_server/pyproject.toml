[project]
name = "domino-mcp-server"
version = "0.1.0"
description = "MCP server for the Domino Data Lab platform: start Jobs, read their status and logs, sync DFS project files"
readme = "README.md"
requires-python = ">=3.11"
# mcp 2.x removed mcp.server.fastmcp (FastMCP became MCPServer); stay on 1.x until the server is
# ported. The `cli` extra (typer) is not needed to run the server.
dependencies = [
    "mcp>=1.6.0,<2",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
]

# Tests: `uv run --with pytest pytest` in this directory (pytest is deliberately not a dependency
# so that `uv run domino_mcp_server.py` installs nothing a user does not need).
[tool.pytest.ini_options]
testpaths = ["tests"]
